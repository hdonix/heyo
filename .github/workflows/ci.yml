name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # What this push or pull request adds; a branch pushed for the first
      # time has nothing to be compared with but its own last commit.
      - name: Check the commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            scripts/check-commits.sh "$HEAD~1..$HEAD"
          else
            scripts/check-commits.sh "$BASE..$HEAD"
          fi

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Skia needs nothing installed for itself, here or on Windows below:
      # the crate that binds it fetches a prebuilt library with curl while
      # it is built (no clang, Python or ninja, which are for building Skia
      # from source), and on Linux links fontconfig and freetype, whose
      # development files come with WebKitGTK's.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libxkbcommon-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      # The oldest Node.js that Heyo runs extensions in.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Type-checks both, and leaves the runtime's scripts where the host's
      # build looks for them.
      - name: Build the interface and the runtime
        run: pnpm build

      - name: Test the interface and the runtime
        run: pnpm test

      - name: Test the host
        working-directory: src-tauri
        run: cargo test --locked

      # The host's tests write the types the interface and the runtime share.
      - name: Check that shared/bindings is what the host declares
        run: git diff --exit-code -- shared/bindings

  windows:
    name: Windows (compiles)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The host's build bundles the runtime's scripts.
      - name: Build the runtime
        run: pnpm build:runtime

      - name: Check the host
        working-directory: src-tauri
        run: cargo check --locked
