name: heyo_ui
description: "Heyo's interface drawn by Flutter: one of its windows for each process."
publish_to: 'none'
# The version that counts is Heyo's (src-tauri/tauri.conf.json), which the
# runner is built with; this one is never shown.
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # The icons the web view draws (lucide-react), as a font.
  lucide_icons_flutter: ^3.1.0
  # Application icons and extension assets are often SVG files, which
  # Flutter does not read by itself.
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/shadows/
  fonts:
    # The face the web view bundles (@fontsource-variable/inter): one file
    # with every weight.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
